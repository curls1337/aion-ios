name: Build Aion iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Xcode Build Configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Native iOS (.ipa)
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Xcode & SDK environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS App (Unsigned for Sideloading)
        env:
          BUILD_CONFIG: ${{ inputs.build_configuration || 'Release' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Aion.xcodeproj \
            -scheme Aion \
            -configuration "$BUILD_CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package unsigned IPA
        env:
          BUILD_CONFIG: ${{ inputs.build_configuration || 'Release' }}
        run: |
          APP_PATH="build/DerivedData/Build/Products/${BUILD_CONFIG}-iphoneos/Aion.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Aion.app not found at $APP_PATH"
            find build -maxdepth 5
            exit 1
          fi

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qry ../../Aion-iOS-unsigned.ipa Payload
          cd ../..
          ls -lh Aion-iOS-unsigned.ipa

      - name: Sign IPA (Optional — runs only if Apple signing secrets are configured)
        if: ${{ secrets.P12_BASE64 != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'aion-ci-keychain' }}
        run: |
          set -e
          mkdir -p build/signing
          echo "$P12_BASE64" | base64 --decode > build/signing/cert.p12
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > build/signing/profile.mobileprovision

          KEYCHAIN_PATH="$RUNNER_TEMP/aion-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import build/signing/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i build/signing/profile.mobileprovision)")
          cp build/signing/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          cp build/signing/profile.mobileprovision build/ipa/Payload/Aion.app/embedded.mobileprovision
          security cms -D -i build/signing/profile.mobileprovision > build/signing/profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' build/signing/profile.plist > build/signing/entitlements.plist

          codesign --force --sign "$SIGN_IDENTITY" --entitlements build/signing/entitlements.plist --timestamp=none build/ipa/Payload/Aion.app
          cd build/ipa
          zip -qry ../../Aion-iOS-signed.ipa Payload
          cd ../..
          ls -lh Aion-iOS-signed.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aion-iOS-unsigned-ipa
          path: Aion-iOS-unsigned.ipa
          retention-days: 30

      - name: Upload Signed IPA Artifact (if created)
        if: hashFiles('Aion-iOS-signed.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Aion-iOS-signed-ipa
          path: Aion-iOS-signed.ipa
          retention-days: 30

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Aion-iOS-*.ipa
